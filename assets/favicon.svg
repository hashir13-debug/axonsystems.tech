  </defs>
  <rect width="64" height="64" rx="16" fill="url(#axBg)"/>
  <g fill="none" stroke="url(#axLine)" stroke-width="3.4" stroke-linecap="round">
    <path d="M24 32 C33 24 40 16 50 13"/>
    <path d="M25 34 C35 31 43 28 53 29"/>
    <path d="M24 37 C32 42 39 47 47 50"/>
    <path d="M18 31 C14 29 11 27 8 27" stroke-width="2.6" opacity=".8"/>
