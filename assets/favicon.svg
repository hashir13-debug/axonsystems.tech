       cell body with axons reaching out to their terminals. -->
  <defs>
    <radialGradient id="axBg" cx=".3" cy=".55" r=".9">
      <stop offset="0" stop-color="#3A0E08"/><stop offset="1" stop-color="#140707"/>
    </radialGradient>
    <radialGradient id="axSoma" cx=".38" cy=".36" r=".7">
      <stop offset="0" stop-color="#FFE3A3"/><stop offset=".45" stop-color="#FF7A2A"/><stop offset="1" stop-color="#D6280F"/>
    </radialGradient>
    <linearGradient id="axLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A24"/><stop offset="1" stop-color="#FF3D1F"/>
